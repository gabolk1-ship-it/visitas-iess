# Compila la app y la publica en GitHub Pages cada vez que se sube un cambio a la rama main.
# Requiere: Settings > Pages > Source: GitHub Actions, y la variable de repositorio API_URL
# (Settings > Secrets and variables > Actions > Variables) con la URL /exec de Apps Script.
name: Publicar app
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  publicar:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci
        working-directory: app
      - run: npm run build
        working-directory: app
        env:
          VITE_API_URL: ${{ vars.API_URL }}
          BASE: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with: { path: app/dist }
      - uses: actions/deploy-pages@v4
